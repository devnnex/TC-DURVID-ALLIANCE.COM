name: Avisos inmediatos y recordatorios
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: stock-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: vars.STOCK_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD_BASE64: ${{ secrets.ORACLE_PASSWORD_BASE64 }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: infrastructure/notifications/package-lock.json
      - name: Preparar solo el remitente
        run: node scripts/prepare-notification-runtime.mjs "$RUNNER_TEMP/alliance-notifications"
      - name: Instalar dependencias del remitente
        working-directory: ${{ runner.temp }}/alliance-notifications
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enviar avisos pendientes
        working-directory: ${{ runner.temp }}/alliance-notifications
        run: node --import tsx scripts/stock-notification-worker.ts --once --burst
